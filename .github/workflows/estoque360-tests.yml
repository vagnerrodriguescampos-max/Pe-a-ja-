name: Estoque 360 Tests

on:
  push:
    branches: [estoque-360, estoque-360-shell-safe]
    paths:
      - 'bi-roldao-production/backend/estoque_*.py'
      - 'bi-roldao-production/frontend/js/estoque360*.js'
      - 'bi-roldao-production/frontend/css/estoque360.css'
      - 'bi-roldao-production/integration/**'
      - 'bi-roldao-production/tests/**'
      - 'bi-roldao-production/requirements-estoque360.txt'
      - '.github/workflows/estoque360-tests.yml'
  pull_request:
    paths:
      - 'bi-roldao-production/backend/estoque_*.py'
      - 'bi-roldao-production/frontend/js/estoque360*.js'
      - 'bi-roldao-production/frontend/css/estoque360.css'
      - 'bi-roldao-production/integration/**'
      - 'bi-roldao-production/tests/**'
      - 'bi-roldao-production/requirements-estoque360.txt'
      - '.github/workflows/estoque360-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de teste e parser Excel
        run: python -m pip install --upgrade pip pytest duckdb -r bi-roldao-production/requirements-estoque360.txt
      - name: Smoke test python-calamine
        run: python -c "from python_calamine import CalamineWorkbook; assert hasattr(CalamineWorkbook, 'from_path')"
      - name: Rodar testes Estoque 360
        run: python -m pytest -q bi-roldao-production/tests/test_estoque360*.py
